[project]
name = "cvrptw-optimizer"
version = "1.1.1"
description = "Optimiseur de tournées de livraison (CVRPTW) avec rechargement en hub, basé sur Google OR-Tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Le noyau, c'est-à-dire tout ce qu'il faut pour générer un scénario, le résoudre
# et en sortir un document de tournée : `optimizer.scenario` et ce qu'il importe.
#
# Le rendu et les campagnes de mesure sont en extras parce qu'ils ne sont pas du
# même ordre de grandeur. Un service web qui appelle `solve_scenario` installe
# 139 Mo avec ce noyau seul ; ajouter pandas, matplotlib, seaborn et folium le
# porte au-delà de ce qu'une fonction serverless accepte, pour du code qu'il
# n'appelle jamais. Le programme en ligne de commande, lui, veut `[cli]`.
dependencies = [
    # Solveur de routage sous contraintes.
    # Note : ne pas descendre sous 9.15 sans revoir optimizer/solver.py, et voir
    # `set_allowed_vehicles` pour la régression SWIG de la 9.15 (or-tools#4982).
    "ortools>=9.15",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Tracés des courbes de réponse de la campagne de calibration. Le rapport texte
# de `experiments.analyse` se passe de cette dépendance ; seuls les graphiques
# la réclament.
experiments = [
    "matplotlib>=3.7",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
cvrptw-solve = "optimizer.main:main"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    # Tests qui font tourner le solveur jusqu'au bout de son budget. Le scénario
    # de référence verrouille les valeurs publiées dans la démonstration : il
    # coûte 30 s, et reste dans l'exécution par défaut pour cette raison.
    # `pytest -m "not slow"` donne la boucle rapide.
    "slow: exécute une vraie résolution OR-Tools (plusieurs dizaines de secondes)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["optimizer"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# E/F : erreurs et fautes de base. I : ordre des imports. UP : tournures
# modernisables. B : pièges usuels (bugbear). C4 : compréhensions.
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = [
    # Les messages d'assertion des tests portent souvent des f-strings longues,
    # et les docstrings du solveur citent des formules qu'on ne coupe pas.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Les tests construisent des dictionnaires de données à la main : les boucles
# d'assertion y sont volontairement explicites.
"tests/**" = ["B011"]
