
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>CVRP Visualization</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        #mapContainer {
            position: relative;
            width: 1200px;
            height: 800px;
            margin: 20px auto;
            background: #f0f0f0; /* Simple background color */
            border: 2px solid #444;
        }
        .depotIcon {
            width: 24px;
            height: 24px;
            background: url('https://cdn-icons-png.flaticon.com/512/190/190488.png') no-repeat center center;
            background-size: contain;
            position: absolute;
            transform: translate(-12px, -12px);
        }
        .hubIcon {
            width: 24px;
            height: 24px;
            background: url('https://cdn-icons-png.flaticon.com/512/252/252025.png') no-repeat center center;
            background-size: contain;
            position: absolute;
            transform: translate(-12px, -12px);
        }
        .deliveryIcon {
            width: 20px;
            height: 20px;
            background: url('https://cdn-icons-png.flaticon.com/512/190/190411.png') no-repeat center center;
            background-size: contain;
            position: absolute;
            transform: translate(-10px, -10px);
        }
        .vehicleIcon {
            width: 26px;
            height: 26px;
            background: url('https://cdn-icons-png.flaticon.com/512/477/477579.png') no-repeat center center;
            background-size: contain;
            position: absolute;
            transform: translate(-13px, -13px);
        }
        .label {
            position: absolute;
            background: white;
            color: black;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 12px;
            border: 1px solid #666;
        }
        #timeSlider {
            width: 50%;
            margin: 20px auto;
            display: block;
        }
        #infoPanel {
            width: 50%;
            margin: 10px auto;
            text-align: center;
            font-family: sans-serif;
        }
        #infoPanel span {
            margin: 0 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2 style="text-align:center;">CVRP Solution Visualization</h2>
    <input id="timeSlider" type="range" min="0" max="200" value="0" />
    <div id="infoPanel">
        Time: <span id="currentTime">0</span> / 200
    </div>
    <div id="mapContainer">
    </div>
    <script>
        let depotsData = [{'node': 0, 'x': 570.0, 'y': 400.0, 'demand': 0}, {'node': 1, 'x': 570.0, 'y': 400.0, 'demand': -3}, {'node': 2, 'x': 570.0, 'y': 400.0, 'demand': -3}, {'node': 3, 'x': 570.0, 'y': 400.0, 'demand': -3}, {'node': 4, 'x': 570.0, 'y': 400.0, 'demand': -3}, {'node': 5, 'x': 570.0, 'y': 400.0, 'demand': -3}];
        let hubsData = [{'node': 22, 'x': 427.5, 'y': 600.0, 'demand': -1}, {'node': 23, 'x': 427.5, 'y': 600.0, 'demand': 1}];
        let deliveriesData = [{'node': 6, 'x': 285.0, 'y': 0.0, 'demand': 1}, {'node': 7, 'x': 1140.0, 'y': 0.0, 'demand': 1}, {'node': 8, 'x': 0.0, 'y': 100.0, 'demand': 1}, {'node': 9, 'x': 142.5, 'y': 100.0, 'demand': 1}, {'node': 10, 'x': 712.5, 'y': 200.0, 'demand': 1}, {'node': 11, 'x': 997.5, 'y': 200.0, 'demand': 1}, {'node': 12, 'x': 427.5, 'y': 300.0, 'demand': 1}, {'node': 13, 'x': 855.0, 'y': 300.0, 'demand': 1}, {'node': 14, 'x': 712.5, 'y': 500.0, 'demand': 1}, {'node': 15, 'x': 1140.0, 'y': 500.0, 'demand': 1}, {'node': 16, 'x': 142.5, 'y': 600.0, 'demand': 1}, {'node': 17, 'x': 285.0, 'y': 600.0, 'demand': 1}, {'node': 18, 'x': 427.5, 'y': 700.0, 'demand': 1}, {'node': 19, 'x': 855.0, 'y': 700.0, 'demand': 1}, {'node': 20, 'x': 0.0, 'y': 800.0, 'demand': 1}, {'node': 21, 'x': 997.5, 'y': 800.0, 'demand': 1}, {'node': 24, 'x': 0.0, 'y': 0.0, 'demand': 0}];
        let vehiclesData = [{'vehicle_id': 0, 'color': '#FF0000', 'steps': [{'node': 0, 'time': 0, 'x': 570.0, 'y': 400.0, 'load': 0}, {'node': 17, 'time': 5, 'x': 285.0, 'y': 600.0, 'load': 0}, {'node': 13, 'time': 20, 'x': 855.0, 'y': 300.0, 'load': 1}, {'node': 21, 'time': 32, 'x': 997.5, 'y': 800.0, 'load': 2}, {'node': 0, 'time': 46, 'x': 570.0, 'y': 400.0, 'load': 3}]}, {'vehicle_id': 1, 'color': '#0000FF', 'steps': [{'node': 0, 'time': 0, 'x': 570.0, 'y': 400.0, 'load': 0}, {'node': 12, 'time': 2, 'x': 427.5, 'y': 300.0, 'load': 0}, {'node': 5, 'time': 9, 'x': 570.0, 'y': 400.0, 'load': 1}, {'node': 10, 'time': 28, 'x': 712.5, 'y': 200.0, 'load': 0}, {'node': 1, 'time': 37, 'x': 570.0, 'y': 400.0, 'load': 1}, {'node': 9, 'time': 60, 'x': 142.5, 'y': 100.0, 'load': 0}, {'node': 8, 'time': 66, 'x': 0.0, 'y': 100.0, 'load': 1}, {'node': 4, 'time': 81, 'x': 570.0, 'y': 400.0, 'load': 2}, {'node': 7, 'time': 107, 'x': 1140.0, 'y': 0.0, 'load': 0}, {'node': 15, 'time': 118, 'x': 1140.0, 'y': 500.0, 'load': 1}, {'node': 23, 'time': 132, 'x': 427.5, 'y': 600.0, 'load': 2}, {'node': 0, 'time': 141, 'x': 570.0, 'y': 400.0, 'load': 3}]}, {'vehicle_id': 2, 'color': '#008000', 'steps': [{'node': 0, 'time': 0, 'x': 570.0, 'y': 400.0, 'load': 0}, {'node': 14, 'time': 2, 'x': 712.5, 'y': 500.0, 'load': 0}, {'node': 3, 'time': 9, 'x': 570.0, 'y': 400.0, 'load': 1}, {'node': 18, 'time': 29, 'x': 427.5, 'y': 700.0, 'load': 0}, {'node': 19, 'time': 39, 'x': 855.0, 'y': 700.0, 'load': 1}, {'node': 11, 'time': 51, 'x': 997.5, 'y': 200.0, 'load': 2}, {'node': 2, 'time': 63, 'x': 570.0, 'y': 400.0, 'load': 3}, {'node': 16, 'time': 85, 'x': 142.5, 'y': 600.0, 'load': 0}, {'node': 20, 'time': 94, 'x': 0.0, 'y': 800.0, 'load': 1}, {'node': 22, 'time': 106, 'x': 427.5, 'y': 600.0, 'load': 2}, {'node': 6, 'time': 119, 'x': 285.0, 'y': 0.0, 'load': 1}, {'node': 0, 'time': 132, 'x': 570.0, 'y': 400.0, 'load': 2}]}, {'vehicle_id': 3, 'color': '#800080', 'steps': [{'node': 0, 'time': 121, 'x': 570.0, 'y': 400.0, 'load': 0}, {'node': 24, 'time': 132, 'x': 0.0, 'y': 0.0, 'load': 0}, {'node': 0, 'time': 200, 'x': 570.0, 'y': 400.0, 'load': 0}]}];

        let mapContainer = document.getElementById("mapContainer");

        // --- Add depots ---
        depotsData.forEach(d => {
            let icon = document.createElement("div");
            icon.className = "depotIcon";
            icon.style.left = d.x + "px";
            icon.style.top = d.y + "px";
            mapContainer.appendChild(icon);

            let label = document.createElement("div");
            label.className = "label";
            label.style.left = (d.x + 12) + "px";
            label.style.top = (d.y + 12) + "px";
            label.textContent = "Depot " + d.node + " (dem:"+ d.demand +")";
            mapContainer.appendChild(label);
        });

        // --- Add hubs ---
        hubsData.forEach(h => {
            let icon = document.createElement("div");
            icon.className = "hubIcon";
            icon.style.left = h.x + "px";
            icon.style.top = h.y + "px";
            mapContainer.appendChild(icon);

            let label = document.createElement("div");
            label.className = "label";
            label.style.left = (h.x + 12) + "px";
            label.style.top = (h.y + 12) + "px";
            label.textContent = "Hub " + h.node + " (dem:"+ h.demand +")";
            mapContainer.appendChild(label);
        });

        // --- Add deliveries ---
        deliveriesData.forEach(dp => {
            let icon = document.createElement("div");
            icon.className = "deliveryIcon";
            icon.style.left = dp.x + "px";
            icon.style.top = dp.y + "px";
            mapContainer.appendChild(icon);

            let label = document.createElement("div");
            label.className = "label";
            label.style.left = (dp.x + 10) + "px";
            label.style.top = (dp.y + 10) + "px";
            label.textContent = "Loc " + dp.node + " (dem:"+ dp.demand +")";
            mapContainer.appendChild(label);
        });

        // --- Add vehicles ---
        let vehicleElements = vehiclesData.map(v => {
            let vehicleEl = document.createElement("div");
            vehicleEl.className = "vehicleIcon";
            vehicleEl.style.border = "2px solid " + v.color;
            mapContainer.appendChild(vehicleEl);

            let vehicleLabel = document.createElement("div");
            vehicleLabel.className = "label";
            vehicleLabel.style.borderColor = v.color;
            vehicleLabel.style.borderWidth = "2px";
            vehicleLabel.style.borderStyle = "solid";
            vehicleLabel.textContent = "V" + v.vehicle_id + " load:?";
            mapContainer.appendChild(vehicleLabel);

            return {
                vehicle_id: v.vehicle_id,
                color: v.color,
                steps: v.steps,
                iconEl: vehicleEl,
                labelEl: vehicleLabel
            };
        });

        function updateVehiclePositions(currentT) {
            vehicleElements.forEach(ve => {
                let steps = ve.steps;
                if (steps.length == 1 || currentT <= steps[0].time) {
                    placeVehicle(ve, steps[0]);
                    return;
                }
                if (currentT >= steps[steps.length - 1].time) {
                    placeVehicle(ve, steps[steps.length - 1]);
                    return;
                }
                for (let i = 0; i < steps.length - 1; i++) {
                    let s1 = steps[i];
                    let s2 = steps[i+1];
                    if (s1.time <= currentT && currentT < s2.time) {
                        let ratio = (currentT - s1.time) / (s2.time - s1.time);
                        let x = s1.x + ratio * (s2.x - s1.x);
                        let y = s1.y + ratio * (s2.y - s1.y);
                        // On suppose load instantané => on garde s1.load
                        placeVehicle(ve, { x: x, y: y, load: s1.load });
                        return;
                    }
                }
            });
        }

        function placeVehicle(ve, step) {
            ve.iconEl.style.left = step.x + "px";
            ve.iconEl.style.top = step.y + "px";
            ve.labelEl.style.left = (step.x + 15) + "px";
            ve.labelEl.style.top = (step.y + 15) + "px";
            ve.labelEl.textContent = "V" + ve.vehicle_id + " load:" + step.load;
        }

        let slider = document.getElementById("timeSlider");
        let currentTimeSpan = document.getElementById("currentTime");
        
        slider.addEventListener("input", () => {
            let val = parseInt(slider.value, 10);
            currentTimeSpan.textContent = val;
            updateVehiclePositions(val);
        });

        // Initial placement at time=0
        updateVehiclePositions(0);
    </script>
</body>
</html>
