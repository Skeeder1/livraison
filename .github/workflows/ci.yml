name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualite:
    name: Lint et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installer Python
        run: uv python install 3.12

      - name: Installer le projet
        # `--extra experiments` tire matplotlib, dont dépendent les tracés de la
        # campagne de calibration ; `--extra dev` apporte pytest et ruff.
        run: uv sync --extra dev --extra experiments

      - name: Ruff
        run: uv run ruff check optimizer tests experiments

      - name: Tests
        # Le scénario de référence consomme son budget complet : la suite tourne
        # en une minute environ, ce qui reste tenable sans découpage.
        run: uv run pytest -q

  interface:
    name: Interface web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer
        working-directory: web
        run: npm ci

      - name: Vérification des types
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build
